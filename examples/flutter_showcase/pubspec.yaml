name: mds_flutter_showcase
description: Interactive Showcase Gallery for Master Design System (MDS)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  mds_flutter_tokens:
    path: ../../packages/mds_flutter_tokens
  mds_flutter_ui:
    path: ../../packages/mds_flutter_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
